<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign In — LeafPoint</title>
  <style>
    /* ============================================================
       LEAFPOINT LOGIN — Design tokens match the World Tree dashboard
       ============================================================ */
    :root {
      --bg: oklch(97% 0.005 245);
      --surface: rgba(255, 255, 255, 0.48);
      --surface-solid: #ffffff;
      --surface-input: rgba(255, 255, 255, 0.62);
      --fg: oklch(16% 0.018 252);
      --fg-secondary: oklch(38% 0.022 250);
      --muted: oklch(54% 0.016 250);
      --border: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --accent: oklch(56% 0.19 148);
      --accent-deep: oklch(48% 0.17 146);
      --accent-soft: oklch(74% 0.14 148);
      --accent-glow: oklch(62% 0.21 148 / 0.35);
      --gold: oklch(70% 0.19 82);
      --red: oklch(53% 0.22 22);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --shadow-card: 0 2px 16px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.03);
      --shadow-elevated: 0 8px 32px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      font-family: var(--font-body);
      color: var(--fg);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 0%, oklch(62% 0.14 148 / 0.12), transparent 55%),
        radial-gradient(ellipse at 80% 100%, oklch(62% 0.10 148 / 0.08), transparent 50%),
        radial-gradient(ellipse at 50% 50%, oklch(72% 0.06 170 / 0.06), transparent 60%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
    }

    /* ============================================================
       LOGIN SHELL — full-screen centering
       ============================================================ */
    .login-shell {
      width: 100%;
      max-width: 880px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-elevated);
      overflow: hidden;
      animation: shellIn 0.5s ease-out;
    }
    @keyframes shellIn {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============================================================
       LEFT PANE — Login form
       ============================================================ */
    .login-form-pane {
      padding: 40px 36px 36px;
      display: flex; flex-direction: column; gap: 24px;
      background: var(--surface-solid);
    }

    .login-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display);
      font-size: 22px; font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--fg);
    }
    .login-logo .logo-icon {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), oklch(52% 0.16 150));
      display: grid; place-items: center; font-size: 20px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .login-welcome h1 {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 800;
      letter-spacing: -0.03em; line-height: 1.15;
      color: var(--fg);
    }
    .login-welcome p {
      margin-top: 6px;
      font-size: 14px; color: var(--muted);
      line-height: 1.4;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label {
      font-size: 13px; font-weight: 700;
      color: var(--fg-secondary);
      letter-spacing: -0.01em;
    }
    .form-input-wrap { position: relative; }
    .form-input {
      width: 100%; height: 48px;
      padding: 0 16px;
      background: var(--surface-input);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font: 15px/1.4 var(--font-body);
      color: var(--fg);
      transition: all 0.2s ease;
      outline: none;
    }
    .form-input::placeholder { color: oklch(62% 0.01 250); }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px oklch(62% 0.21 148 / 0.1);
      background: var(--surface-solid);
    }
    .form-input.error {
      border-color: var(--red);
      box-shadow: 0 0 0 4px oklch(53% 0.22 22 / 0.08);
    }
    .form-input.success { border-color: var(--accent); }
    .form-error-msg {
      font-size: 11px; color: var(--red); font-weight: 600;
      min-height: 16px; transition: opacity 0.2s;
    }

    .form-row { display: flex; align-items: center; justify-content: space-between; }

    .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--fg-secondary); user-select: none; }
    .remember-me input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--accent);
      cursor: pointer; border-radius: 4px;
    }

    .forgot-link {
      font-size: 13px; font-weight: 600; color: var(--accent);
      text-decoration: none; transition: color 0.15s;
    }
    .forgot-link:hover { color: var(--accent-deep); text-decoration: underline; }

    .login-btn {
      width: 100%; height: 52px;
      border: none; border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent), oklch(50% 0.16 148));
      color: #fff;
      font: 16px/1 var(--font-display);
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.25s ease;
      display: grid; place-items: center;
      box-shadow: 0 4px 18px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px oklch(62% 0.21 148 / 0.45);
      background: linear-gradient(135deg, oklch(58% 0.19 148), oklch(52% 0.17 148));
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn.loading { pointer-events: none; opacity: 0.85; }
    .login-btn .btn-text { transition: opacity 0.2s; }
    .login-btn.loading .btn-text { opacity: 0; }
    .login-btn .spinner {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      opacity: 0; transition: opacity 0.2s;
    }
    .login-btn.loading .spinner { opacity: 1; }
    .spinner-ring {
      width: 26px; height: 26px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }

    .sso-btn {
      width: 100%; height: 46px;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface-input);
      font: 14px/1 var(--font-body);
      font-weight: 600; color: var(--fg-secondary);
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .sso-btn:hover { background: var(--surface-solid); border-color: oklch(80% 0.03 250); }

    /* ============================================================
       RIGHT PANE — Tree illustration + stats
       ============================================================ */
    .login-illustration-pane {
      padding: 32px 28px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px;
      background: radial-gradient(ellipse at 50% 40%, oklch(62% 0.12 148 / 0.08), transparent 70%),
                  oklch(98% 0.005 250);
      position: relative;
      overflow: hidden;
    }
    .login-illustration-pane::before {
      content: '';
      position: absolute; top: -60px; right: -40px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, oklch(62% 0.18 148 / 0.08), transparent 70%);
      pointer-events: none;
    }
    .login-illustration-pane::after {
      content: '';
      position: absolute; bottom: -40px; left: -30px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, oklch(72% 0.10 170 / 0.06), transparent 70%);
      pointer-events: none;
    }
    .tree-ill-wrap {
      width: 180px; height: 220px;
      position: relative; z-index: 1;
    }
    .tree-ill-wrap svg { width: 100%; height: 100%; display: block; }
    @keyframes treeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .tree-ill-wrap { animation: treeFloat 5s ease-in-out infinite; }

    .stats-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex; gap: 20px;
      z-index: 1; width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }
    .stat-item {
      display: flex; flex-direction: column; gap: 2px;
      flex: 1; text-align: center;
    }
    .stat-item:first-child { border-right: 1px solid var(--border-subtle); padding-right: 16px; }
    .stat-value {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .stat-label {
      font-size: 11px; color: var(--muted);
      font-weight: 600; letter-spacing: 0.02em;
    }

    .login-footer {
      text-align: center; font-size: 11px; color: var(--muted);
      grid-column: 1 / -1;
      padding: 14px 0 4px;
      border-top: 1px solid var(--border-subtle);
      margin: 0 36px;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: var(--radius-md);
      background: var(--accent); color: #fff;
      font: 14px/1.3 var(--font-body); font-weight: 700;
      box-shadow: 0 8px 28px var(--accent-glow);
      z-index: 1000;
      animation: toastIn 0.35s ease-out, toastOut 0.35s 2.2s ease-out forwards;
      pointer-events: none;
    }
    .toast.error { background: var(--red); box-shadow: 0 8px 28px oklch(53% 0.22 22 / 0.3); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 700px) {
      .login-shell {
        grid-template-columns: 1fr;
        max-width: 420px;
      }
      .login-illustration-pane {
        order: -1;
        padding: 24px 16px 16px;
        gap: 12px;
      }
      .tree-ill-wrap { width: 120px; height: 150px; }
      .login-form-pane { padding: 20px 20px 28px; gap: 18px; }
      .login-welcome h1 { font-size: 22px; }
      .stats-card { padding: 12px 16px; gap: 12px; }
      .stat-value { font-size: 18px; }
      .login-footer { margin: 0 20px; }
    }
    @media (max-width: 380px) {
      .login-shell { border-radius: var(--radius-lg); }
      .login-form-pane { padding: 16px 14px 22px; }
      .form-row { flex-direction: column; gap: 10px; align-items: flex-start; }
      .forgot-link { align-self: flex-end; }
    }
  </style>
</head>
<body>

<!-- ============================================================
     LOGIN SHELL
     ============================================================ -->
<div class="login-shell" id="login-shell">

  <!-- ---- LEFT: Form ---- -->
  <div class="login-form-pane">
    <div class="login-logo">
      <span class="logo-icon">🌳</span>
      LeafPoint
    </div>
    <div class="login-welcome">
      <h1>Welcome Back</h1>
      <p>Sign in to continue your attendance journey</p>
    </div>

    <form id="login-form" novalidate autocomplete="on">
      <div style="display:flex;flex-direction:column;gap:18px;">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="form-input-wrap">
            <input class="form-input" type="email" id="email" name="email"
                   placeholder="you@company.com"
                   autocomplete="email" required />
          </div>
          <span class="form-error-msg" id="email-error"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="form-input-wrap">
            <input class="form-input" type="password" id="password" name="password"
                   placeholder="••••••••"
                   autocomplete="current-password" required minlength="6" />
          </div>
          <span class="form-error-msg" id="password-error"></span>
        </div>

        <!-- Remember + Forgot -->
        <div class="form-row">
          <label class="remember-me">
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <a href="#" class="forgot-link" id="forgot-link">Forgot Password?</a>
        </div>

        <!-- Login button -->
        <button type="submit" class="login-btn" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner"><span class="spinner-ring"></span></span>
        </button>

        <!-- Divider -->
        <div class="divider">or continue with</div>

        <!-- SSO -->
        <button type="button" class="sso-btn" id="sso-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
          Single Sign-On
        </button>

      </div>
    </form>
  </div>

  <!-- ---- RIGHT: Tree illustration + stats ---- -->
  <div class="login-illustration-pane">
    <div class="tree-ill-wrap">
      <!-- Blooming Tree (Stage 4) — simplified for illustration -->
      <svg viewBox="0 0 220 290" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="leaf1" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#4CAF50"/>
            <stop offset="100%" stop-color="#1E5E24"/>
          </radialGradient>
          <radialGradient id="leaf2" cx="50%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#6FBF6F"/>
            <stop offset="100%" stop-color="#2E6B2E"/>
          </radialGradient>
          <radialGradient id="blossom" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFD1DC"/>
            <stop offset="100%" stop-color="#E8879B"/>
          </radialGradient>
        </defs>
        <!-- Shadow -->
        <ellipse cx="110" cy="264" rx="48" ry="7" fill="#00000012"/>
        <!-- Soil -->
        <ellipse cx="110" cy="256" rx="32" ry="6" fill="#6B4F12" opacity="0.5"/>
        <ellipse cx="110" cy="253" rx="26" ry="4.5" fill="#5C3D0E" opacity="0.4"/>
        <!-- Trunk -->
        <path d="M103 253 Q100 222 95 185 Q90 150 88 115 Q84 92 86 76" stroke="#5D4037" stroke-width="11" stroke-linecap="round" fill="none"/>
        <path d="M117 253 Q114 222 110 185 Q106 150 104 115 Q100 92 102 76" stroke="#4E342E" stroke-width="8" stroke-linecap="round" fill="none"/>
        <!-- Branches -->
        <path d="M95 150 Q78 135 58 118" stroke="#5D4037" stroke-width="5.5" stroke-linecap="round" fill="none"/>
        <path d="M106 138 Q124 120 142 106" stroke="#4E342E" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M95 115 Q76 98 64 78" stroke="#5D4037" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M104 104 Q118 84 128 64" stroke="#4E342E" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M88 88 Q70 72 58 52" stroke="#5D4037" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Canopy -->
        <circle cx="84" cy="70" r="24" fill="url(#leaf1)"/>
        <circle cx="106" cy="54" r="28" fill="url(#leaf2)"/>
        <circle cx="126" cy="66" r="22" fill="url(#leaf1)"/>
        <circle cx="62" cy="58" r="18" fill="url(#leaf2)"/>
        <circle cx="142" cy="60" r="16" fill="url(#leaf1)"/>
        <circle cx="94" cy="40" r="20" fill="url(#leaf2)"/>
        <circle cx="114" cy="36" r="18" fill="url(#leaf1)"/>
        <circle cx="78" cy="32" r="14" fill="url(#leaf2)"/>
        <circle cx="136" cy="48" r="13" fill="url(#leaf1)"/>
        <!-- Blossoms -->
        <circle cx="80" cy="62" r="4.5" fill="url(#blossom)"/>
        <circle cx="106" cy="46" r="5.5" fill="url(#blossom)"/>
        <circle cx="128" cy="58" r="4" fill="url(#blossom)"/>
        <circle cx="64" cy="50" r="3.5" fill="url(#blossom)"/>
        <circle cx="140" cy="52" r="3" fill="url(#blossom)"/>
        <circle cx="94" cy="32" r="3.5" fill="url(#blossom)"/>
        <circle cx="116" cy="28" r="3" fill="url(#blossom)"/>
        <circle cx="74" cy="26" r="2.5" fill="url(#blossom)"/>
      </svg>
    </div>

    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-value">1,245</span>
        <span class="stat-label">Check-ins Completed</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">98%</span>
        <span class="stat-label">Attendance Rate</span>
      </div>
    </div>
  </div>

  <!-- ---- Footer ---- -->
  <div class="login-footer">
    © 2025 LeafPoint Attendance System. All rights reserved.
  </div>

</div>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
(function() {
  const form = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const forgotLink = document.getElementById('forgot-link');
  const ssoBtn = document.getElementById('sso-btn');

  // ---- TOAST ----
  function showToast(msg, type) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast ' + (type === 'error' ? 'error' : '');
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2600);
  }

  // ---- VALIDATION ----
  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function clearErrors() {
    emailInput.classList.remove('error','success');
    passwordInput.classList.remove('error','success');
    emailError.textContent = '';
    passwordError.textContent = '';
  }

  function setLoading(loading) {
    if (loading) {
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
    } else {
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;
    }
  }

  // ---- Real-time validation ----
  emailInput.addEventListener('blur', function() {
    if (emailInput.value.trim() === '') {
      emailInput.classList.add('error');
      emailInput.classList.remove('success');
      emailError.textContent = 'Email is required';
    } else if (!validateEmail(emailInput.value.trim())) {
      emailInput.classList.add('error');
      emailInput.classList.remove('success');
      emailError.textContent = 'Please enter a valid email address';
    } else {
      emailInput.classList.remove('error');
      emailInput.classList.add('success');
      emailError.textContent = '';
    }
  });

  emailInput.addEventListener('input', function() {
    if (emailInput.classList.contains('error') && validateEmail(emailInput.value.trim())) {
      emailInput.classList.remove('error');
      emailInput.classList.add('success');
      emailError.textContent = '';
    }
  });

  passwordInput.addEventListener('blur', function() {
    if (passwordInput.value.trim() === '') {
      passwordInput.classList.add('error');
      passwordInput.classList.remove('success');
      passwordError.textContent = 'Password is required';
    } else if (passwordInput.value.length < 6) {
      passwordInput.classList.add('error');
      passwordInput.classList.remove('success');
      passwordError.textContent = 'Password must be at least 6 characters';
    } else {
      passwordInput.classList.remove('error');
      passwordInput.classList.add('success');
      passwordError.textContent = '';
    }
  });

  passwordInput.addEventListener('input', function() {
    if (passwordInput.classList.contains('error') && passwordInput.value.length >= 6) {
      passwordInput.classList.remove('error');
      passwordInput.classList.add('success');
      passwordError.textContent = '';
    }
  });

  // ---- FORM SUBMIT ----
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearErrors();

    let hasError = false;

    // Validate email
    if (emailInput.value.trim() === '') {
      emailInput.classList.add('error');
      emailError.textContent = 'Email is required';
      hasError = true;
    } else if (!validateEmail(emailInput.value.trim())) {
      emailInput.classList.add('error');
      emailError.textContent = 'Please enter a valid email address';
      hasError = true;
    }

    // Validate password
    if (passwordInput.value.trim() === '') {
      passwordInput.classList.add('error');
      passwordError.textContent = 'Password is required';
      hasError = true;
    } else if (passwordInput.value.length < 6) {
      passwordInput.classList.add('error');
      passwordError.textContent = 'Password must be at least 6 characters';
      hasError = true;
    }

    if (hasError) {
      // Focus first error
      const firstError = form.querySelector('.form-input.error');
      if (firstError) firstError.focus();
      return;
    }

    // Simulate login
    setLoading(true);
    setTimeout(function() {
      setLoading(false);
      const remember = document.getElementById('remember').checked;
      showToast('✓ Signed in successfully! Welcome back.', 'success');

      // Briefly flash the shell
      var shell = document.getElementById('login-shell');
      shell.style.boxShadow = '0 0 0 6px var(--accent-glow), var(--shadow-elevated)';
      setTimeout(function() {
        shell.style.boxShadow = 'var(--shadow-elevated)';
      }, 600);

      if (remember) {
        try { localStorage.setItem('leafpoint_remembered_email', emailInput.value.trim()); } catch(_) {}
      }
    }, 1600);
  });

  // ---- FORGOT PASSWORD ----
  forgotLink.addEventListener('click', function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (email && validateEmail(email)) {
      showToast('Password reset link sent to ' + email);
    } else {
      showToast('Please enter your email address first', 'error');
      emailInput.focus();
    }
  });

  // ---- SSO ----
  ssoBtn.addEventListener('click', function() {
    setLoading(true);
    setTimeout(function() {
      setLoading(false);
      showToast('SSO redirect initiated…');
    }, 1000);
  });

  // ---- Restore remembered email ----
  try {
    const remembered = localStorage.getItem('leafpoint_remembered_email');
    if (remembered) {
      emailInput.value = remembered;
      document.getElementById('remember').checked = true;
    }
  } catch(_) {}

  // ---- Keyboard shortcut — Enter submits ----
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement === document.body) {
      emailInput.focus();
    }
  });
})();
</script>

</body>
</html>
